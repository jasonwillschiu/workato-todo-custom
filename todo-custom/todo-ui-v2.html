<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workato Todo v2</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:48px 18px}
main{width:min(620px,100%)}h1{margin:0 0 6px;font-size:32px}.sub{color:#64748b;margin:0 0 24px}
form{display:flex;gap:10px;background:white;padding:12px;border-radius:16px;box-shadow:0 10px 35px #26344a18}
input[type=text]{flex:1;border:1px solid #d5ddea;border-radius:10px;padding:12px 14px;font-size:16px;outline:none}
input[type=text]:focus{border-color:#6d5dfc;box-shadow:0 0 0 3px #6d5dfc22}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.add{background:#5b4cf0;color:white}
ul{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;background:white;padding:14px 16px;border-radius:14px;box-shadow:0 5px 20px #26344a10}
li span{flex:1}.done span{text-decoration:line-through;color:#94a3b8}.delete{background:transparent;color:#94a3b8;padding:5px 8px;font-size:18px}.delete:hover{color:#dc2626}
.empty{text-align:center;color:#94a3b8;padding:28px}.badge{display:inline-block;background:#e9e7ff;color:#5143d9;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;margin-bottom:14px}
.error{background:#fef2f2;color:#b91c1c;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<main>
<div class="badge">HOSTED ENTIRELY IN WORKATO</div>
<h1>Todo</h1>
<p class="sub">Backed by the Todo App API &mdash; persisted in a Workato Data Table.</p>
<p id="error" class="error" hidden></p>
<form id="todo-form"><input id="todo-input" type="text" maxlength="160" placeholder="What needs doing?" autocomplete="off"><button class="add" type="submit">Add</button></form>
<ul id="todo-list"></ul>
<p id="empty" class="empty">No todos yet. Add one above.</p>
</main>
<script>
const BASE="https://apim.workato.com/anz-presales/todo-app/ui";
const TOKEN="REDACTED_API_TOKEN";
const F={id:"11fbe9a6_a16d_4d7e_86ea_afe42ec03005",title:"3c688cb9_f069_420d_99a9_62180137b81e",completed:"ddc9a141_bb20_46d3_9eec_17cbe8ba9ed5"};
const list=document.querySelector("#todo-list"),empty=document.querySelector("#empty"),form=document.querySelector("#todo-form"),input=document.querySelector("#todo-input"),err=document.querySelector("#error");
let todos=[];
function showError(msg){err.textContent=msg;err.hidden=!msg}
// The backend returns a Ruby Hash#inspect string (key=>value), not JSON. Convert it before parsing.
function parseRubyHash(str){
 let s=str.trim();
 if(s==="[]"||s==="{}")return JSON.parse(s);
 s=s.replace(/"=>/g,'":');
 s=s.replace(/:nil\b/g,':null');
 s=s.replace(/:(\s*)(\d{4}-\d{2}-\d{2} [\d:.]+ [+-]\d{4})/g,':$1"$2"');
 return JSON.parse(s);
}
async function apiList(){
 const res=await fetch(`${BASE}?api_token=${TOKEN}`,{method:"PATCH"});
 const data=await res.json();
 return parseRubyHash(data.records_json||"[]");
}
async function apiCreate(title){
 const res=await fetch(`${BASE}?api_token=${TOKEN}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,completed:false})});
 const data=await res.json();
 if(!data.record_json)throw new Error(data.message||"Create failed");
 return parseRubyHash(data.record_json);
}
async function apiUpdate(id,title,completed){
 const res=await fetch(`${BASE}?api_token=${TOKEN}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,title,completed})});
 const data=await res.json();
 if(!data.record_json)throw new Error(data.message||"Update failed");
 return parseRubyHash(data.record_json);
}
async function apiDelete(id){
 const res=await fetch(`${BASE}?id=${encodeURIComponent(id)}&api_token=${TOKEN}`,{method:"DELETE"});
 const data=await res.json();
 if(data.status!=="deleted")throw new Error(data.message||"Delete failed");
}
function render(){
 list.replaceChildren();
 empty.hidden=todos.length>0;
 todos.forEach(todo=>{
  const done=todo[F.completed]===true;
  const li=document.createElement("li");if(done)li.className="done";
  const check=document.createElement("input");check.type="checkbox";check.checked=done;check.ariaLabel="Mark complete";
  check.onchange=async()=>{
   try{const updated=await apiUpdate(todo[F.id],todo[F.title],check.checked);Object.assign(todo,updated);render();}
   catch(e){showError(e.message);check.checked=!check.checked;}
  };
  const text=document.createElement("span");text.textContent=todo[F.title];
  const del=document.createElement("button");del.className="delete";del.type="button";del.ariaLabel="Delete";del.textContent="×";
  del.onclick=async()=>{
   try{await apiDelete(todo[F.id]);todos=todos.filter(t=>t[F.id]!==todo[F.id]);render();}
   catch(e){showError(e.message);}
  };
  li.append(check,text,del);list.append(li);
 });
}
async function refresh(){
 try{todos=await apiList();render();showError("");}
 catch(e){showError("Could not load todos: "+e.message);}
}
form.onsubmit=async e=>{
 e.preventDefault();
 const title=input.value.trim();
 if(!title)return;
 try{
  const created=await apiCreate(title);
  todos.push(created);
  input.value="";
  render();
  showError("");
 }catch(e){showError(e.message);}
};
refresh();
</script>
</body>
</html>
